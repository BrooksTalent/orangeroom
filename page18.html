<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第18课｜遇到错误怎样解决</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><header><div class="brand"><span class="brand-badge">C</span>Codex 小手册<span class="office">博库人才办公室 整理制作</span></div><span class="chapter chapter-advance">进阶实战篇</span><div class="progress" aria-label="第18课，共20课"><span class="progress-fill" style="--lesson:18"></span></div></header><main><section class="section" style="border-top:0"><span class="eyebrow">第 18 课 · 找出问题</span><h1>“坏了”不是终点，<br>而是一条侦探线索</h1><p class="lead">阅读日网页的报名按钮没有反应。与其只说“坏了”，不如把预期和实际情况告诉 Codex。</p><div class="detective"><div>① 重现<br>问题</div><div>② 查看<br>讯息</div><div>③ 猜测<br>原因</div><div>④ 修改<br>一处</div><div>⑤ 再次<br>测试</div></div><div class="prompt">“我按下‘我要报名’后，原本应该出现确认讯息，但现在没有反应。请找出原因，修改后再测试。”</div></section><section class="section"><h2>报告错误的四件事</h2><div class="lesson-map"><div class="lesson-chip"><strong>想发生什么</strong>预期结果</div><div class="lesson-chip"><strong>实际发生什么</strong>目前结果</div><div class="lesson-chip"><strong>在哪一步</strong>操作过程</div><div class="lesson-chip"><strong>看到什么</strong>错误讯息</div></div></section><nav class="nav"><a class="btn secondary" href="page17.html">← 上一课</a><a class="btn" href="page19.html">下一课：人负责最后决定 →</a></nav></main><footer>第 11–20 课 · 进阶实战篇<div class="footer-brand"><div class="poster-logo"><img src="brand-logo.png" alt="博库标志"></div><span class="footer-office">博库人才办公室 · 整理制作</span></div></footer></div></body></html>
