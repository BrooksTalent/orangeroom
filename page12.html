<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第12课｜保护原来的文件</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><header><div class="brand"><span class="brand-badge">C</span>Codex 小手册<span class="office">博库人才办公室 整理制作</span></div><span class="chapter chapter-advance">进阶实战篇</span><div class="progress" aria-label="第12课，共20课"><span class="progress-fill" style="--lesson:12"></span></div></header><main><section class="section" style="border-top:0"><span class="eyebrow">第 12 课 · 保护原稿</span><h1>先留一份原稿，<br>修改就更放心</h1><p class="lead">小明想改善作文排版，但又怕原来的内容消失。最简单的方法，是要求 Codex 另存一个新版本。</p><div class="task-sheet"><div class="task-row"><div class="task-label">保留</div><div class="task-value">原来的作文完全不改。</div></div><div class="task-row"><div class="task-label">另存</div><div class="task-value">建立“作文修改版”。</div></div><div class="task-row"><div class="task-label">说明</div><div class="task-value">完成后列出改了什么。</div></div></div><div class="prompt">“请保留原来的作文，另外建立‘作文修改版’，改善标题和段落，完成后列出你修改了什么。”</div></section><section class="section"><div class="safety"><h2>安全口诀</h2><p class="lead">重要文件先备份；修改时另开新版；不满意还可以回到原稿。</p></div></section><nav class="nav"><a class="btn secondary" href="page11.html">← 上一课</a><a class="btn" href="page13.html">下一课：重复工作交给助手 →</a></nav></main><footer>第 11–20 课 · 进阶实战篇<div class="footer-brand"><div class="poster-logo"><img src="brand-logo.png" alt="博库标志"></div><span class="footer-office">博库人才办公室 · 整理制作</span></div></footer></div></body></html>
